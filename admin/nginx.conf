# 后台管理系统 Nginx 配置
# 将此文件内容复制到 /etc/nginx/conf.d/photo-admin.conf

server {
    listen 80;
    server_name admin.yourdomain.com;  # 替换为你的域名或使用 IP

    # 管理后台静态文件目录
    root /opt/photo-admin/dist;
    index index.html;

    # 上传文件大小限制
    client_max_body_size 50M;

    # 前端路由 - SPA 单页应用
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # 上传的静态文件
    location /uploads/ {
        proxy_pass http://127.0.0.1:5001/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 日志
    access_log /var/log/nginx/photo-admin-access.log;
    error_log /var/log/nginx/photo-admin-error.log;
}
